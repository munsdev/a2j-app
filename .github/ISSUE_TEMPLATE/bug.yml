name: Something does not work
description: A bug, a broken screen or wrong text
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open Goals
        2. Tap …
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android, Safari on iPhone 13 …
  - type: dropdown
    id: lang
    attributes:
      label: Language of the app
      options: [German, English]
  - type: markdown
    attributes:
      value: Please do not paste personal data from your profile. A security problem? Email casey@muns.dev instead, see SECURITY.md.
